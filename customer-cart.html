<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
    <title>Middletons Customer View</title>
    <link href="./css/bootstrap.css" rel="stylesheet" />
    <style>
        :root {
            --cerulean: #0d6efd;
            --cerulean-dark: #0b5ed7;
            --cerulean-transparent: rgba(13, 110, 253, 0.85);
            --surface: #fefefe;
        }

        body {
            background:
                linear-gradient(135deg, rgba(220, 233, 255, 0.9) 0%, rgba(248, 251, 255, 0.9) 55%, rgba(255, 255, 255, 0.95) 100%),
                url("./assets/brickwall.jpg") center/cover fixed;
            background-blend-mode: lighten;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }

        .customer-shell {
            min-height: 100vh;
        }

        .customer-card {
            border: none;
            background: var(--surface);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(13, 18, 43, 0.18);
        }

        .customer-surface {
            background: var(--surface);
        }

        .customer-header {
            border-bottom: 1px solid rgba(13, 110, 253, 0.35);
        }

        .customer-header .badge {
            background: var(--cerulean);
            color: #fff;
        }

        .customer-table thead th {
            color: #4c5d7e;
            letter-spacing: 0.06em;
            font-size: 0.8rem;
        }

        .customer-table tbody tr td {
            border: none;
        }

        .customer-highlight {
            color: var(--cerulean-dark);
        }

        .customer-footer {
            background: #fff;
            border-top: 1px solid rgba(13, 110, 253, 0.15);
        }

        .customer-carousel-card {
            background: #fff;
            border-radius: 32px;
            border: 1px solid rgba(13, 110, 253, 0.2);
            box-shadow: 0 25px 50px rgba(13, 37, 114, 0.18);
        }

        .customer-carousel-image {
            min-height: 170px;
            max-height: 300px;
            border-radius: 24px;
            position: center;
            background: radial-gradient(circle at top left, rgba(13, 110, 253, 0.2), rgba(255, 255, 255, 0.7));
        }

        .customer-carousel-image img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            border-radius: 24px;
            background: radial-gradient(circle, rgba(13, 110, 253, 0.08), rgba(255, 255, 255, 0.8));
            padding: 12px;
        }

        .customer-carousel-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(13, 110, 253, 0.4);
            background: transparent;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .customer-carousel-indicator.active {
            background: rgba(13, 110, 253, 0.85);
        }

        .customer-carousel-section {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 2.5rem;
            min-height: 340px;
            box-sizing: border-box;
        }

        .customer-carousel-card h3 {
            font-size: 2rem;
            line-height: 1.25;
            font-weight: 600;
            color: #08306b;
            text-shadow: 0 2px 6px rgba(8, 48, 107, 0.25);
        }

        #customerCarouselCaption {
            font-size: 1.15rem;
            color: rgba(8, 48, 107, 0.85);
            letter-spacing: 0.02em;
        }

        .text-cerulean {
            color: var(--cerulean-dark);
        }
    </style>
</head>

<body>
    <div class="container-fluid customer-shell d-flex align-items-center py-4 px-3">
        <div class="w-100">
            <div class="customer-card customer-surface p-4 h-100 d-flex flex-column">
                <div class="customer-header pb-3 mb-3">
                    <div class="d-flex justify-content-between align-items-start gap-3 flex-column flex-md-row">
                        <div>
                            <span class="badge rounded-pill text-uppercase fs-7">Cart View</span>
                            <h1 id="customerCartTitle" class="display-5 fw-semibold mb-1 text-cerulean">Current Cart
                            </h1>
                            <p id="customerCartMeta" class="mb-0 text-muted fs-6">Waiting for items…</p>
                        </div>
                        <div class="text-end">
                            <div class="text-uppercase text-muted small mb-1">Total</div>
                            <div class="display-4 fw-bold text-cerulean">$<span id="customerTotal">0.00</span></div>
                            <div class="d-flex justify-content-end align-items-end gap-3">
                                <div id="customerCashReceivedWrap" class="text-end mt-2 d-none">
                                    <div class="text-uppercase text-muted small mb-1">Cash Received</div>
                                    <div class="fs-5 fw-semibold text-cerulean">$<span
                                            id="customerCashReceived">0.00</span></div>
                                </div>
                                <div id="customerChangeDueWrap" class="text-end mt-2 d-none">
                                    <div class="text-uppercase text-muted small mb-1">Change Due</div>
                                    <div class="fs-5 fw-semibold text-cerulean">$<span
                                            id="customerChangeDue">0.00</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-fill overflow-hidden customer-table-wrap">
                    <div class="table-responsive">
                        <table class="table customer-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Item</th>
                                    <th scope="col" class="text-center" style="width: 120px;">Qty</th>
                                    <th scope="col" class="text-end" style="width: 200px;">Line Total</th>
                                </tr>
                            </thead>
                            <tbody id="customerCartBody"></tbody>
                        </table>
                    </div>
                </div>

                <footer class="customer-footer pt-3 mt-4">
                    <div class="row text-center text-cerulean fw-semibold gy-2">
                        <div class="col-4">
                            <div class="text-muted small">Subtotal</div>
                            <div class="fs-4">$<span id="customerSubtotal">0.00</span></div>
                        </div>
                        <div class="col-4">
                            <div class="text-muted small">Tax</div>
                            <div class="fs-4">$<span id="customerTax">0.00</span></div>
                        </div>
                        <div class="col-4">
                            <div class="text-muted small">Total</div>
                            <div class="fs-4">$<span id="customerTotalSummary">0.00</span></div>
                        </div>
                    </div>
                </footer>
            </div>
            <section class="customer-carousel customer-carousel-section d-none" id="customerCarouselSection">
                <div class="customer-carousel-card p-4 mt-3">
                    <div class="row gx-3 gy-4 align-items-center flex-column flex-lg-row">
                        <div class="col-lg-5">
                            <div class="customer-carousel-image overflow-hidden">
                                <img id="customerCarouselImage" src="" alt="Carousel visual" style="display:none;">
                            </div>
                        </div>
                        <div class="col-lg-7">
                            <p class="text-uppercase text-muted small mb-1">Announcements</p>
                            <h3 id="customerCarouselTitle" class="text-cerulean fw-semibold mb-2">Nothing to show
                                yet</h3>
                            <p id="customerCarouselCaption" class="mb-0 text-muted">Announcements for your shoppers.
                            </p>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center gap-2 mt-3" id="customerCarouselIndicators"></div>
                </div>
            </section>
        </div>
    </div>

    <script src="js/customer-cart.js"></script>
</body>

</html>
