<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Manage Vendors - Middleton’s</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="./css/bootstrap.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: #f8f9fa;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        @media (max-width: 992px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <span class="navbar-brand">Middleton’s Antiques & Uniques</span>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">POS</a>
                <a class="nav-link" href="receipts.html">Receipts</a>
                <a class="nav-link" href="reports.html">Reports</a>
                <div class="nav-item dropdown me-2">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">Configuration</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="vendors.html">Manage Vendors</a></li>
                        <li><a class="dropdown-item" href="cashiers.html">Manage Cashiers</a></li>
                        <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Vendor Management</h5>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="vendorSortButton"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Sort: Name (A-Z)
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="vendorSortButton">
                            <li><button class="dropdown-item" type="button" onclick="setVendorSort('name')">Name
                                    (A-Z)</button></li>
                            <li><button class="dropdown-item" type="button" onclick="setVendorSort('code')">Vendor Code
                                    (A-Z)</button></li>
                        </ul>
                    </div>
                </div>

                <div class="form-grid">
                    <div>
                        <label for="newVendorCode" class="form-label">Vendor Code <span class="text-muted">(unique,
                                optional)</span></label>
                        <input type="text" id="newVendorCode" class="form-control" placeholder="e.g., JDE">
                    </div>
                    <div>
                        <label for="newVendorName" class="form-label">Vendor Name</label>
                        <input type="text" id="newVendorName" class="form-control" placeholder="e.g., Jane Doe">
                    </div>
                    <div>
                        <label for="newVendorPhone" class="form-label">Phone</label>
                        <input type="text" id="newVendorPhone" class="form-control" placeholder="e.g., 402-555-1212">
                    </div>

                    <div class="d-grid">
                        <label class="form-label invisible">Add</label>
                        <button class="btn btn-primary" onclick="addVendor()">Add Vendor</button>
                    </div>
                </div>

                <hr>

                <div class="table-responsive">
                    <table id="vendorTable" class="table table-striped align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:20%">Code</th>
                                <th style="width:40%">Name</th>
                                <th style="width:25%">Phone</th>
                                <th style="width:15%">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <script src="vendors.js"></script>
</body>

</html>
