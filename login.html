<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tillmere POS Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./css/bootstrap.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2933;
      --muted: #52606d;
      --paper: #f3efe7;
      --card: #ffffff;
      --accent: #2f6b57;
      --accent-dark: #1f4a3b;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff8f0 0%, #f1ece4 50%, #e6dfd6 100%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.1em;
    }
    .brand h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }
    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div>
        <h1>Tillmere POS</h1>
        <div class="hint">Secure sign-in required</div>
      </div>
    </div>
    <p class="subtitle">Sign in to access the Tillmere point of sale.</p>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" autocomplete="username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" autocomplete="current-password" required />
      </div>
      <div id="loginError" class="text-danger small mb-3" style="display:none;"></div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
  </div>
  <script defer src="./js/login.js"></script>
</body>
</html>
