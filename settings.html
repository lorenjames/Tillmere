<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings - Middleton's</title>
  <link href="./css/bootstrap.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
      <span class="navbar-brand">Middleton's Antiques & Uniques</span>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">POS</a>
        <a class="nav-link" href="receipts.html">Receipts</a>
        <a class="nav-link" href="reports.html">Reports</a>
        <div class="nav-item dropdown me-2">
          <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Configuration</a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="vendors.html">Manage Vendors</a></li>
            <li><a class="dropdown-item" href="cashiers.html">Manage Cashiers</a></li>
            <li><a class="dropdown-item" href="settings.html">Settings</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Sales Tax</h5>
            <div class="row g-2 align-items-end">
              <div class="col-8 col-md-6">
                <label for="taxRatePct" class="form-label">Tax Rate (%)</label>
                <input type="number" step="0.01" min="0" id="taxRatePct" class="form-control" placeholder="e.g., 7.25">
              </div>
              <div class="col-4 col-md-3 d-grid">
                <label class="form-label invisible">Save</label>
                <button id="saveBtn" class="btn btn-primary">Save</button>
              </div>
            </div>
            <div class="text-muted small mt-2">This rate is used on the POS screen to compute tax.</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Developer</h5>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="devMode">
              <label class="form-check-label" for="devMode">Developer Mode</label>
            </div>
            <div class="text-muted small mt-2">Shows developer options like "Reindex IDs" on the Receipts page.</div>
            <div class="mt-3">
              <button id="saveDevBtn" class="btn btn-primary">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="text-muted small mt-4 text-center">
      App Version: <span id="appVersion">v</span>
    </div>
  </main>

  <script src="settings.js"></script>
</body>
</html>
