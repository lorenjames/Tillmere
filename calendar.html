<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Monthly Planner</title>
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <style>
    :root {
      --accent: #6f3f1b;
      --border-light: rgba(0, 0, 0, 0.08);
      --notes-line: rgba(0, 0, 0, 0.15);
    }

    body {
      background: #f6f2ee;
      min-height: 100vh;
      padding: 1rem;
      font-family: "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
      color: #282828;
    }

    @page {
      size: landscape;
      margin: 0.4in;
    }

    .calendar-page {
      max-width: 1000px;
      margin: 0 auto;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 1rem;
    }

    .calendar-title {
      font-family: "Georgia", "Times New Roman", serif;
      margin: 0;
      font-size: 32px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      line-height: 1.2;
    }

    .calendar-subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #746657;
    }

    .calendar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .calendar-wrapper {
      background: #fffdfa;
      border-radius: 18px;
      padding: 1.25rem;
      border: 1px solid var(--border-light);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
    }

    .calendar-table {
      width: 100%;
      border-collapse: collapse;
    }

    .calendar-table th,
    .calendar-table td {
      border: 1px solid var(--border-light);
      padding: 0.35rem 0.4rem;
      vertical-align: top;
    }

    .calendar-table th {
      background: #fff;
      color: var(--accent);
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-align: center;
    }

    .calendar-day {
      min-height: 90px;
      position: relative;
    }

    .calendar-day .day-number {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #2d1b12;
    }

    .calendar-day.outside .day-number {
      color: #c4b6a5;
    }

    .notes-header {
      width: 130px;
    }

    .notes-column {
      padding: 1rem;
      border-left: 2px solid var(--border-light);
      background: #fff;
    }

    .notes-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 600;
      color: var(--accent);
    }

    .note-line {
      border-bottom: 1px solid var(--notes-line);
      margin-bottom: 0.55rem;
      width: 100%;
    }

    .has-no-background {
      background: none;
    }

    @media print {
      html, body {
        height: 100%;
        background: #fff;
        padding: 0;
      }
      body {
        font-size: 0.9rem;
      }
      .calendar-controls {
        display: none;
      }
      .calendar-wrapper {
        box-shadow: none;
        border: none;
        padding: 0;
        margin: 0;
        min-height: 100%;
      }
      .calendar-page {
        margin: 0;
      }
      .calendar-table th {
        background: #fff;
      }
      .calendar-table,
      .calendar-table tbody,
      .calendar-table tr {
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <div class="calendar-page">
    <div class="calendar-header">
      <div>
        <h1 id="calendarTitle" class="calendar-title">December 2025</h1>
      </div>
      <div class="calendar-controls">
        <label for="monthSelect" class="visually-hidden">Month</label>
        <select id="monthSelect" class="form-select form-select-sm"></select>
        <label for="yearSelect" class="visually-hidden">Year</label>
        <select id="yearSelect" class="form-select form-select-sm"></select>
        <button id="updateCalendarBtn" class="btn btn-outline-secondary btn-sm">Update</button>
        <button id="printCalendarBtn" class="btn btn-primary btn-sm">Print</button>
      </div>
    </div>
    <div class="calendar-wrapper">
      <div id="calendarGrid"></div>
    </div>
  </div>
  <script src="./calendar.js"></script>
</body>

</html>
